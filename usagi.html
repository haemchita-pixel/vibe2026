<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우사기의 제초 작업! 🌱</title>
    <style>
        body {
            background-image: url('chiikawa_town.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0; overflow: hidden;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        #game-board {
            width: 100%; max-width: 100%;
            height: 100vh;
            position: relative; cursor: crosshair;
            margin: 0 auto;
            touch-action: manipulation;
        }
        .weed {
            position: absolute;
            width: clamp(44px, 12vw, 88px); cursor: pointer;
            transition: transform 0.1s;
            user-select: none; -webkit-user-select: none;
            -webkit-user-drag: none; touch-action: manipulation;
        }
        .usagi {
            position: absolute;
            width: clamp(100px, 22vw, 300px); cursor: pointer;
            z-index: 10; animation: wobble 0.5s infinite;
            user-select: none; -webkit-user-select: none;
            -webkit-user-drag: none; touch-action: manipulation;
        }
        .usagi-cute {
            position: absolute;
            width: clamp(90px, 20vw, 270px); cursor: pointer;
            z-index: 10; animation: wobble 0.6s infinite;
            user-select: none; -webkit-user-select: none;
            -webkit-user-drag: none; touch-action: manipulation;
        }
        .lopear {
            position: absolute;
            width: clamp(90px, 20vw, 270px); cursor: pointer;
            z-index: 10; animation: wobble 0.7s infinite;
            user-select: none; -webkit-user-select: none;
            -webkit-user-drag: none; touch-action: manipulation;
        }
        .usagi-haa {
            position: absolute;
            width: clamp(90px, 20vw, 270px); cursor: pointer;
            z-index: 10; animation: wobble 0.8s infinite;
            user-select: none; -webkit-user-select: none;
            -webkit-user-drag: none; touch-action: manipulation;
        }
        .usagi-fun {
            position: absolute;
            width: clamp(90px, 20vw, 270px); cursor: pointer;
            z-index: 10; animation: wobble 0.9s infinite;
            user-select: none; -webkit-user-select: none;
            -webkit-user-drag: none; touch-action: manipulation;
        }
        @keyframes wobble {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        #score-board {
            position: fixed; top: 20px; left: 20px;
            font-size: 24px; font-weight: bold; color: #2E7D32;
            background: white; padding: 10px 20px; border-radius: 20px;
            z-index: 100;
        }
        #timer-board {
            position: fixed; top: 20px; right: 20px;
            font-size: 24px; font-weight: bold; color: #2E7D32;
            background: white; padding: 10px 20px; border-radius: 20px;
            z-index: 100;
            transition: color 0.3s;
        }
        #timer-board.urgent {
            color: #c62828;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* 시작 화면 */
        #start-screen {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 200;
        }
        #start-screen h2 {
            color: #fff; font-size: 2rem; margin-bottom: 12px;
        }
        #start-screen p {
            color: #ddd; font-size: 1rem; margin-bottom: 32px;
        }
        #start-btn {
            background: linear-gradient(135deg, #a8e063, #56ab2f);
            color: #fff; border: none;
            padding: 16px 52px; font-size: 1.3rem;
            font-weight: 700; border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(86,171,47,0.45);
        }
        #start-btn:hover { filter: brightness(1.1); }

        /* 종료 화면 */
        #end-screen {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 200;
        }
        #end-screen h2 {
            color: #ffd200; font-size: 3.2rem; margin-bottom: 16px;
        }
        #final-score {
            color: #fff; font-size: 2.2rem; margin-bottom: 28px;
        }
        #convict-img {
            width: clamp(160px, 40vw, 300px);
            border-radius: 20px;
            margin-bottom: 32px;
            animation: shake 0.4s ease infinite;
        }
        @keyframes shake {
            0%   { transform: rotate(-4deg); }
            50%  { transform: rotate(4deg); }
            100% { transform: rotate(-4deg); }
        }
        #restart-btn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e; border: none;
            padding: 18px 64px; font-size: 1.5rem;
            font-weight: 700; border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,210,0,0.4);
            margin-bottom: 18px;
        }
        #restart-btn:hover { filter: brightness(1.1); }
        #home-btn {
            background: transparent;
            color: #ccc; border: 1px solid #888;
            padding: 14px 44px; font-size: 1.2rem;
            border-radius: 50px; cursor: pointer;
        }
        #home-btn:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

    <div id="score-board">제초 점수: <span id="score">0</span></div>
    <div id="timer-board">⏱ <span id="timer">30</span>초</div>
    <div id="game-board"></div>

    <div id="start-screen">
        <h2>🌱 우사기의 제초 작업!</h2>
        <p>30초 안에 잡초를 최대한 많이 제거하세요!<br>🌿 잡초 +10점 &nbsp;|&nbsp; 🐰 우사기 +50점</p>
        <button id="start-btn">게임 시작!</button>
    </div>

    <div id="end-screen">
        <h2>⏰ 시간 종료!</h2>
        <img id="convict-img" src="usagi.convict.png" alt="우사기 죄수" style="display:none;" />
        <div id="final-score"></div>
        <button id="restart-btn">다시 하기</button>
        <button id="home-btn" onclick="location.href='index.html'">🍀 로또 페이지로</button>
    </div>

    <audio id="popSound" src="pop.mp3"></audio>
    <audio id="yahaSound" src="yaha.mp3"></audio>
    <audio id="endSound" src="폭탄이얏하맨뒤.m4a"></audio>
    <audio id="cuteSound" src="후웅~.m4a"></audio>
    <audio id="lopearSound" src="울라.m4a"></audio>
    <audio id="haaSound" src="haaa.m4a"></audio>
    <audio id="funSound" src="이얏하.m4a"></audio>

    <script>
        const GAME_TIME = 30;

        function vwSize(vw, min, max) {
            return Math.min(max, Math.max(min, window.innerWidth * vw / 100));
        }

        let score = 0;
        let timeLeft = GAME_TIME;
        let running = false;
        let weedInterval, usagiInterval, cuteInterval, lopearInterval, haaInterval, funInterval, timerInterval;

        const board = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const timerBoard = document.getElementById('timer-board');
        const endScreen = document.getElementById('end-screen');
        const finalScore = document.getElementById('final-score');

        document.getElementById('start-btn').addEventListener('pointerdown', startGame);
        document.getElementById('restart-btn').addEventListener('pointerdown', startGame);

        function startGame() {
            score = 0;
            timeLeft = GAME_TIME;
            running = true;
            scoreDisplay.innerText = 0;
            timerDisplay.innerText = GAME_TIME;
            timerBoard.classList.remove('urgent');
            board.innerHTML = '';

            document.getElementById('start-screen').style.display = 'none';
            endScreen.style.display = 'none';
            document.getElementById('convict-img').style.display = 'none';
            const endSound = document.getElementById('endSound');
            endSound.pause();
            endSound.currentTime = 0;

            weedInterval  = setInterval(createWeed,       1000);
            usagiInterval = setInterval(createUsagi,      5000);
            cuteInterval  = setInterval(createUsagiCute,  7000);
            lopearInterval = setInterval(createLopear,    9000);
            haaInterval   = setInterval(createUsagiHaa,  11000);
            funInterval   = setInterval(createUsagiFun,  13000);
            timerInterval = setInterval(tick, 1000);
        }

        function tick() {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            if (timeLeft <= 10) timerBoard.classList.add('urgent');
            if (timeLeft <= 0) endGame();
        }

        function endGame() {
            running = false;
            clearInterval(weedInterval);
            clearInterval(usagiInterval);
            clearInterval(cuteInterval);
            clearInterval(lopearInterval);
            clearInterval(haaInterval);
            clearInterval(funInterval);
            clearInterval(timerInterval);
            board.innerHTML = '';
            finalScore.innerText = `최종 점수: ${score}점`;

            const convictImg = document.getElementById('convict-img');
            convictImg.style.display = 'block';

            const endSound = document.getElementById('endSound');
            endSound.currentTime = 0;
            endSound.play();

            endScreen.style.display = 'flex';
        }

        function createWeed() {
            if (!running) return;
            const weed = document.createElement('img');
            weed.src = 'grass.png';
            weed.className = 'weed';
            const ws = vwSize(12, 44, 88);
            weed.style.left = Math.random() * (window.innerWidth - ws) + 'px';
            weed.style.top  = Math.random() * (window.innerHeight - ws) + 'px';
            weed.onpointerdown = (e) => {
                e.stopPropagation();
                if (!running) return;
                score += 10;
                scoreDisplay.innerText = score;
                document.getElementById('popSound').play();
                weed.remove();
            };
            board.appendChild(weed);
        }

        function createUsagi() {
            if (!running) return;
            const usagi = document.createElement('img');
            usagi.src = 'usagi.png';
            usagi.className = 'usagi';
            const us = vwSize(22, 100, 300);
            usagi.style.left = Math.random() * (window.innerWidth - us) + 'px';
            usagi.style.top  = Math.random() * (window.innerHeight - us) + 'px';
            usagi.onpointerdown = (e) => {
                e.stopPropagation();
                if (!running) return;
                score += 50;
                scoreDisplay.innerText = score;
                document.getElementById('yahaSound').play();
                usagi.remove();
            };
            board.appendChild(usagi);
            setTimeout(() => usagi.remove(), 4000);
        }

        function createLopear() {
            if (!running) return;
            const lopear = document.createElement('img');
            lopear.src = 'lopear.usagi.png';
            lopear.className = 'lopear';
            lopear.style.left = Math.random() * (window.innerWidth - vwSize(20, 90, 270)) + 'px';
            lopear.style.top  = Math.random() * (window.innerHeight - vwSize(20, 90, 270)) + 'px';
            lopear.onpointerdown = (e) => {
                e.stopPropagation();
                if (!running) return;
                const snd = document.getElementById('lopearSound');
                snd.currentTime = 0;
                snd.play();
                lopear.remove();
            };
            board.appendChild(lopear);
            setTimeout(() => lopear.remove(), 5000);
        }

        function createUsagiHaa() {
            if (!running) return;
            const haa = document.createElement('img');
            haa.src = 'usagi-haa.png';
            haa.className = 'usagi-haa';
            haa.style.left = Math.random() * (window.innerWidth - vwSize(20, 90, 270)) + 'px';
            haa.style.top  = Math.random() * (window.innerHeight - vwSize(20, 90, 270)) + 'px';
            haa.onpointerdown = (e) => {
                e.stopPropagation();
                if (!running) return;
                const snd = document.getElementById('haaSound');
                snd.currentTime = 0;
                snd.play();
                haa.remove();
            };
            board.appendChild(haa);
            setTimeout(() => haa.remove(), 5000);
        }

        function createUsagiFun() {
            if (!running) return;
            const fun = document.createElement('img');
            fun.src = 'usagi.fun.png';
            fun.className = 'usagi-fun';
            fun.style.left = Math.random() * (window.innerWidth - vwSize(20, 90, 270)) + 'px';
            fun.style.top  = Math.random() * (window.innerHeight - vwSize(20, 90, 270)) + 'px';
            fun.onpointerdown = (e) => {
                e.stopPropagation();
                if (!running) return;
                const snd = document.getElementById('funSound');
                snd.currentTime = 0;
                snd.play();
                fun.remove();
            };
            board.appendChild(fun);
            setTimeout(() => fun.remove(), 5000);
        }

        function createUsagiCute() {
            if (!running) return;
            const cute = document.createElement('img');
            cute.src = 'usagi.cute.png';
            cute.className = 'usagi-cute';
            cute.style.left = Math.random() * (window.innerWidth - vwSize(20, 90, 270)) + 'px';
            cute.style.top  = Math.random() * (window.innerHeight - vwSize(20, 90, 270)) + 'px';
            cute.onpointerdown = (e) => {
                e.stopPropagation();
                if (!running) return;
                const snd = document.getElementById('cuteSound');
                snd.currentTime = 0;
                snd.play();
                cute.remove();
            };
            board.appendChild(cute);
            setTimeout(() => cute.remove(), 5000);
        }
    </script>
</body>
</html>
