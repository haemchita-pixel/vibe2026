<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천</title>
  <style>
    :root[data-theme="dark"] {
      --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --text: #fff;
      --subtitle: #aaa;
      --row-bg: rgba(255, 255, 255, 0.07);
      --row-border: rgba(255, 255, 255, 0.12);
      --toggle-bg: rgba(255,255,255,0.12);
      --toggle-color: #ffd200;
      --toggle-border: rgba(255,255,255,0.2);
    }

    :root[data-theme="light"] {
      --bg: linear-gradient(135deg, #e8f4fd 0%, #d0eaf8 50%, #b8dff5 100%);
      --text: #1a1a2e;
      --subtitle: #555;
      --row-bg: rgba(255, 255, 255, 0.75);
      --row-border: rgba(0, 0, 0, 0.1);
      --toggle-bg: rgba(0,0,0,0.08);
      --toggle-color: #0f3460;
      --toggle-border: rgba(0,0,0,0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 40px 20px;
      transition: background 0.4s, color 0.4s;
    }

    .top-bar {
      position: fixed;
      top: 20px;
      right: 24px;
    }

    #theme-toggle {
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--toggle-color);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, border 0.3s;
    }

    #theme-toggle:hover {
      filter: brightness(1.15);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--subtitle);
      margin-bottom: 36px;
      transition: color 0.4s;
    }

    button#generate {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #1a1a2e;
      border: none;
      padding: 16px 48px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 210, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
    }

    button#generate:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(255, 210, 0, 0.55);
    }

    button#generate:active {
      transform: translateY(0);
    }

    #results {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 560px;
    }

    .row {
      background: var(--row-bg);
      border: 1px solid var(--row-border);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.35s ease both;
      transition: background 0.4s, border 0.4s;
      backdrop-filter: blur(6px);
    }

    .row-label {
      font-size: 0.85rem;
      color: #ffd200;
      font-weight: 700;
      min-width: 36px;
    }

    .balls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ball {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25), 0 3px 8px rgba(0,0,0,0.3);
    }

    .b1 { background: linear-gradient(145deg, #f5c518, #e0a800); color: #1a1a2e; }
    .b2 { background: linear-gradient(145deg, #4fc3f7, #0288d1); }
    .b3 { background: linear-gradient(145deg, #ef5350, #c62828); }
    .b4 { background: linear-gradient(145deg, #9e9e9e, #616161); }
    .b5 { background: linear-gradient(145deg, #66bb6a, #2e7d32); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="theme-toggle">☀️ 라이트 모드</button>
  </div>

  <h1>🍀 로또 번호 추천</h1>
  <p class="subtitle">버튼을 누르면 5세트의 행운의 번호를 드립니다!</p>

  <button id="generate">번호 추천받기</button>

  <div id="results"></div>

  <script>
    const html = document.documentElement;
    const toggleBtn = document.getElementById('theme-toggle');

    const saved = localStorage.getItem('theme') || 'dark';
    setTheme(saved);

    toggleBtn.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
      localStorage.setItem('theme', next);
    });

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      toggleBtn.textContent = theme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
    }

    function pickLotto() {
      const nums = [];
      while (nums.length < 6) {
        const n = Math.floor(Math.random() * 45) + 1;
        if (!nums.includes(n)) nums.push(n);
      }
      return nums.sort((a, b) => a - b);
    }

    function ballClass(n) {
      if (n <= 10) return 'b1';
      if (n <= 20) return 'b2';
      if (n <= 30) return 'b3';
      if (n <= 40) return 'b4';
      return 'b5';
    }

    document.getElementById('generate').addEventListener('click', () => {
      const results = document.getElementById('results');
      results.innerHTML = '';

      for (let i = 1; i <= 5; i++) {
        const nums = pickLotto();

        const row = document.createElement('div');
        row.className = 'row';
        row.style.animationDelay = `${(i - 1) * 0.07}s`;

        const label = document.createElement('span');
        label.className = 'row-label';
        label.textContent = `${i}번`;

        const balls = document.createElement('div');
        balls.className = 'balls';

        nums.forEach(n => {
          const ball = document.createElement('div');
          ball.className = `ball ${ballClass(n)}`;
          ball.textContent = n;
          balls.appendChild(ball);
        });

        row.appendChild(label);
        row.appendChild(balls);
        results.appendChild(row);
      }
    });
  </script>
</body>
</html>
