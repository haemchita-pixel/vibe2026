<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    .subtitle {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 36px;
    }

    button#generate {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #1a1a2e;
      border: none;
      padding: 16px 48px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 210, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
    }

    button#generate:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(255, 210, 0, 0.55);
    }

    button#generate:active {
      transform: translateY(0);
    }

    #results {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 560px;
    }

    .row {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.35s ease both;
    }

    .row-label {
      font-size: 0.85rem;
      color: #ffd200;
      font-weight: 700;
      min-width: 36px;
    }

    .balls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ball {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25), 0 3px 8px rgba(0,0,0,0.3);
    }

    /* 번호대별 색상 (실제 로또 기준) */
    .b1  { background: linear-gradient(145deg, #f5c518, #e0a800); color: #1a1a2e; }
    .b2  { background: linear-gradient(145deg, #4fc3f7, #0288d1); }
    .b3  { background: linear-gradient(145deg, #ef5350, #c62828); }
    .b4  { background: linear-gradient(145deg, #9e9e9e, #616161); }
    .b5  { background: linear-gradient(145deg, #66bb6a, #2e7d32); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>🍀 로또 번호 추천</h1>
  <p class="subtitle">버튼을 누르면 5세트의 행운의 번호를 드립니다!</p>

  <button id="generate">번호 추천받기</button>

  <div id="results"></div>

  <script>
    function pickLotto() {
      const nums = [];
      while (nums.length < 6) {
        const n = Math.floor(Math.random() * 45) + 1;
        if (!nums.includes(n)) nums.push(n);
      }
      return nums.sort((a, b) => a - b);
    }

    function ballClass(n) {
      if (n <= 10) return 'b1';
      if (n <= 20) return 'b2';
      if (n <= 30) return 'b3';
      if (n <= 40) return 'b4';
      return 'b5';
    }

    document.getElementById('generate').addEventListener('click', () => {
      const results = document.getElementById('results');
      results.innerHTML = '';

      for (let i = 1; i <= 5; i++) {
        const nums = pickLotto();

        const row = document.createElement('div');
        row.className = 'row';
        row.style.animationDelay = `${(i - 1) * 0.07}s`;

        const label = document.createElement('span');
        label.className = 'row-label';
        label.textContent = `${i}번`;

        const balls = document.createElement('div');
        balls.className = 'balls';

        nums.forEach(n => {
          const ball = document.createElement('div');
          ball.className = `ball ${ballClass(n)}`;
          ball.textContent = n;
          balls.appendChild(ball);
        });

        row.appendChild(label);
        row.appendChild(balls);
        results.appendChild(row);
      }
    });
  </script>
</body>
</html>
